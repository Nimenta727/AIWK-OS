# OPTIONAL package-registry hosts for the cloud agent's deps_install tool. NOT active by default.
# To enable:  sudo cp /etc/aiws/egress-registries.conf /etc/aiws/egress-extra.conf && sudo systemctl restart aiws-egress-proxy
# Why it is opt-in: every allowed host is a place data could be sent (for example inside a URL), because a proxy limits WHERE traffic
# goes, not WHAT it carries. Enable only the languages you use: delete the lines you do not need before copying.
