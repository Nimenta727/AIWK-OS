name: AIWS real offline 2B inference baseline
on:
  push:
    branches: [main]
    paths:
      - 'os/model/ci/**'
      - '.github/workflows/aiws-real-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-qwen-2b-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install reproducible CPU-only build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ git curl libgomp1
      - name: Fetch exact llama.cpp source commit and compile CPU server
        timeout-minutes: 18
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/aiws-llama
          cd /tmp/aiws-llama
          git fetch origin 29b52d398b294509746ec0a3f28948a3107c0213
          git checkout --detach 29b52d398b294509746ec0a3f28948a3107c0213
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target llama-server --parallel 2
          mkdir -p "$GITHUB_WORKSPACE/out/model-real"
          cp build/bin/llama-server "$GITHUB_WORKSPACE/out/model-real/llama-server"
          file "$GITHUB_WORKSPACE/out/model-real/llama-server"
      - name: Download actual Apache-2.0 Qwen3.5-2B Q4 GGUF, verify trusted checksum
        timeout-minutes: 22
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 \
            --output out/model-real/model.gguf \
            https://huggingface.co/SoAIHQ/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf
          echo 'a8b50de00b780c0f3c16f07cb041a1ecd678b6e22fd8cde91e57fe4b5031523b  out/model-real/model.gguf' | sha256sum --check --status
          test "$(wc -c < out/model-real/model.gguf)" -gt 1000000000
      - name: Run actual CPU inference in non-root isolated networkless container
        timeout-minutes: 13
        run: |
          set -Eeuo pipefail
          cp os/model/ci/inference_smoke.py out/model-real/inference_smoke.py
          docker build -t aiws-real-qwen-ci -f os/model/ci/Dockerfile out/model-real
          docker run --rm --network none --cpus 2 --memory 5g --pids-limit 128 \
            --security-opt no-new-privileges --cap-drop ALL --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            aiws-real-qwen-ci | tee out/aiws-real-model-metrics.json
          python3 -c 'import json; d=json.load(open("out/aiws-real-model-metrics.json")); assert d["realModel"] and d["cpu_only"] and d["network"] == "disabled"'
      - name: Upload metrics only (never redistribute model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiws-real-2b-cpu-inference-metrics
          path: out/aiws-real-model-metrics.json
          if-no-files-found: warn
          retention-days: 30
