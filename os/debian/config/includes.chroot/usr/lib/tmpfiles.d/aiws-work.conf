# Applied after the work disk is mounted. The work tree belongs to root; people and the agent get ACLs, nobody else gets anything.
d /srv/aiws-work                 0755 root root -
z /srv/aiws-work/work            0750 root aiws-work -
A+ /srv/aiws-work/work           - - - - u:user:rwx,u:aiws-agent:rwx,d:u:user:rwx,d:u:aiws-agent:rwx,m::rwx
z /srv/aiws-work/.snapshots      0700 root root -
