name: Verified Windows Preview Release

on:
  push:
    branches: [main]
    paths:
      - 'RELEASE_VERSION'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verified-preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-release]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version and output paths
        shell: pwsh
        run: |
          if (!(Test-Path RELEASE_VERSION)) { throw 'Missing RELEASE_VERSION' }
          $version=(Get-Content RELEASE_VERSION -Raw).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$') { throw 'Release must be a preview version' }
          if (!(Test-Path docs/RELEASE_NOTES_V19.md)) { throw 'Missing bilingual release notes' }
          Write-Host "Preparing preview v$version"
      - name: Verify React/Node and Edge interactions
        shell: pwsh
        working-directory: desktop/AIWorkstation.Frontend
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          npm run test:ui
      - name: Verify .NET core and WPF desktop
        shell: pwsh
        run: |
          dotnet build desktop/AIWorkstation.Desktop/AIWorkstation.Desktop.csproj -c Release
          dotnet run --project desktop/AIWorkstation.Core.SmokeTests/AIWorkstation.Core.SmokeTests.csproj -c Release
      - name: Verify legacy Python regression
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q
      - name: Publish Windows x64, license and checksum
        shell: pwsh
        run: |
          $version=(Get-Content RELEASE_VERSION -Raw).Trim()
          $folder='artifacts/win-x64'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          dotnet publish desktop/AIWorkstation.Desktop/AIWorkstation.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output $folder
          if (!(Test-Path "$folder/WindowsAIWorkstation.exe")) { throw 'EXE missing' }
          if (!(Test-Path "$folder/ui-dist/index.html")) { throw 'Offline React UI missing' }
          Copy-Item LICENSE "$folder/LICENSE.txt"
          Copy-Item README.md "$folder/README.md"
          Copy-Item docs/RELEASE_NOTES_V19.md "$folder/RELEASE_NOTES.md"
          New-Item -ItemType Directory -Path "$folder/licenses" -Force | Out-Null
          Copy-Item third_party/t3code/NOTICE.md "$folder/licenses/T3Code-NOTICE.md"
          $zip="artifacts/WindowsAIWorkstation-v$version-win-x64.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $zip -Force
          $digest=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $basename=[IO.Path]::GetFileName($zip)
          Set-Content -Path "$zip.sha256" -Value "$digest  $basename" -Encoding utf8
          if (!(Test-Path "$zip.sha256")) { throw 'Checksum missing' }
          Write-Host "ZIP: $zip"
          Write-Host "SHA256: $digest"
      - name: Upload independently verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIWS-verified-preview-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 28
      - name: Publish a GitHub prerelease (never stable)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version=(Get-Content RELEASE_VERSION -Raw).Trim()
          $tag="v$version"
          $zip="artifacts/WindowsAIWorkstation-v$version-win-x64.zip"
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) { throw "Release $tag already exists; abort rather than overwrite an existing asset." }
          gh release create $tag $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AIWS $tag · Bilingual Observability Preview" --notes-file docs/RELEASE_NOTES_V19.md --prerelease
