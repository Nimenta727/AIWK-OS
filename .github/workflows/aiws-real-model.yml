name: AIWS real offline 2B inference baseline
on:
  push:
    branches: [main]
    paths:
      - 'os/model/ci/**'
      - '.github/workflows/aiws-real-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-qwen-2b-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install reproducible CPU-only build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ git curl libgomp1
      - name: Fetch exact llama.cpp source commit and compile for Debian 13 guest ABI
        timeout-minutes: 22
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/aiws-llama
          cd /tmp/aiws-llama
          git fetch origin 29b52d398b294509746ec0a3f28948a3107c0213
          git checkout --detach 29b52d398b294509746ec0a3f28948a3107c0213
          cd "$GITHUB_WORKSPACE"
          # Runner Ubuntu may have a newer glibc than Debian 13, so it must
          # NOT provide the binary that will execute inside the guest.
          docker build --progress=plain -t aiws-llama-debian-builder \
            -f os/model/ci/Dockerfile.builder /tmp/aiws-llama
          container="$(docker create aiws-llama-debian-builder)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          mkdir -p out/model-real
          docker cp "$container:/src/build/bin/llama-server" out/model-real/llama-server
          chmod 755 out/model-real/llama-server
          file out/model-real/llama-server
          sha256sum out/model-real/llama-server
      - name: Download actual Apache-2.0 Qwen3.5-2B Q4 GGUF, verify trusted checksum
        timeout-minutes: 22
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 \
            --output out/model-real/model.gguf \
            https://huggingface.co/SoAIHQ/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf
          echo 'a8b50de00b780c0f3c16f07cb041a1ecd678b6e22fd8cde91e57fe4b5031523b  out/model-real/model.gguf' | sha256sum --check --status
          test "$(wc -c < out/model-real/model.gguf)" -gt 1000000000
      - name: Reject unsupported llama-server CLI flags before model loading
        run: |
          set -Eeuo pipefail
          python3 os/model/ci/check_llama_cli.py out/model-real/llama-server
      - name: Run actual CPU inference in non-root isolated networkless container
        timeout-minutes: 13
        run: |
          set -Eeuo pipefail
          cp os/model/ci/inference_smoke.py out/model-real/inference_smoke.py
          docker build -t aiws-real-qwen-ci -f os/model/ci/Dockerfile out/model-real
          # Verify a non-root user can actually traverse and read the bundled
          # test script and GGUF before claiming an inference failure.
          docker run --rm --network none --entrypoint /bin/sh aiws-real-qwen-ci \
            -c 'ldd /usr/local/bin/llama-server; ! ldd /usr/local/bin/llama-server | grep -q "not found"'
          docker run --rm --network none --entrypoint /usr/bin/stat aiws-real-qwen-ci \
            -c '%U %a %n' /opt /opt/aiws /opt/aiws/inference_smoke.py /opt/aiws/model.gguf
          docker run --rm --network none --cpus 2 --memory 5g --pids-limit 128 \
            --security-opt no-new-privileges --cap-drop ALL --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            aiws-real-qwen-ci | tee out/aiws-real-model-metrics.json
          python3 -c 'import json; d=json.load(open("out/aiws-real-model-metrics.json")); assert d["realModel"] and d["cpu_only"] and d["network"] == "disabled"'
      - name: Build real-model-inclusive AIWS guest ISO from verified artifacts
        timeout-minutes: 36
        run: |
          set -Eeuo pipefail
          cd workbench
          npm install --no-audit --no-fund
          npm run build
          cd "$GITHUB_WORKSPACE"
          export AIWS_OS_MODEL_GGUF_SHA256=a8b50de00b780c0f3c16f07cb041a1ecd678b6e22fd8cde91e57fe4b5031523b
          export AIWS_OS_LLAMA_SERVER_SHA256="$(sha256sum out/model-real/llama-server | cut -d' ' -f1)"
          docker run --rm --privileged -v "$PWD":/repo -w /repo \
            -e AIWS_OS_MODEL_GGUF_SHA256 \
            -e AIWS_OS_LLAMA_SERVER_SHA256 \
            -e AIWS_OS_MODEL_LICENSE_REVIEWED=1 \
            -e AIWS_OS_MODEL_GUEST_CI_TEST=1 \
            -e AIWS_OS_PROFILE=smoke \
            -e AIWS_OS_OUTPUT=/repo/out/aiws-os-model \
            -e AIWS_OS_BUNDLED_MODEL_GGUF=/repo/out/model-real/model.gguf \
            -e AIWS_OS_BUNDLED_LLAMA_SERVER=/repo/out/model-real/llama-server \
            debian:trixie bash -lc '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools
              ./os/debian/build.sh
            '
          (cd out/aiws-os-model && sha256sum -c live-image-amd64.hybrid.iso.sha256)
      - name: Real offline model inference inside QEMU guest boot
        timeout-minutes: 44
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
          iso="$PWD/out/aiws-os-model/live-image-amd64.hybrid.iso"
          serial="$PWD/out/aiws-guest-model-serial.log"
          mkdir -p "$RUNNER_TEMP/model-live"
          xorriso -osirrox on -indev "$iso" -extract /live "$RUNNER_TEMP/model-live"
          kernel="$(find "$RUNNER_TEMP/model-live" -maxdepth 1 -type f -name 'vmlinuz*' | head -n 1)"
          initrd="$(find "$RUNNER_TEMP/model-live" -maxdepth 1 -type f -name 'initrd*' | head -n 1)"
          test -s "$kernel" && test -s "$initrd"
          qemu-system-x86_64 -machine q35,accel=tcg -cpu max -smp 2 -m 5120 \
            -cdrom "$iso" -kernel "$kernel" -initrd "$initrd" \
            -append 'boot=live components console=tty0 console=ttyS0,115200n8 loglevel=6' \
            -nic none -display none -vga std -serial "file:$serial" -no-reboot &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          passed=0
          for _ in $(seq 1 1150); do
            if [[ -s "$serial" ]] && grep -q 'AIWS_GUEST_MODEL_INFERENCE_PASS' "$serial" &&
                 grep -q 'AIWS_BOOT_SMOKE_PASS' "$serial"; then
              passed=1
              break
            fi
            if [[ -s "$serial" ]] && grep -q 'AIWS_BOOT_SMOKE_FAIL' "$serial"; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 140 "$serial" || true
          if grep -q 'AIWS_GUEST_MODEL_BENCHMARK ' "$serial"; then
            grep 'AIWS_GUEST_MODEL_BENCHMARK ' "$serial" | tail -n 1 | sed 's/^.*AIWS_GUEST_MODEL_BENCHMARK //' > out/aiws-guest-model-benchmark.json
            python3 -m json.tool out/aiws-guest-model-benchmark.json >/dev/null
          fi
          if grep -q 'AIWS_GUEST_MODEL_BENCHMARK_V2 ' "$serial"; then
            # Report-only release-candidate set (242 locked cases: writes, plans, refusals).
            grep 'AIWS_GUEST_MODEL_BENCHMARK_V2 ' "$serial" | tail -n 1 | sed 's/^.*AIWS_GUEST_MODEL_BENCHMARK_V2 //' > out/aiws-guest-model-benchmark-v2.json
            python3 -m json.tool out/aiws-guest-model-benchmark-v2.json >/dev/null
          fi
          if grep -q 'AIWS_GUEST_MODEL_BENCHMARK_V3 ' "$serial"; then
            # Report-only v3 set (v2 + integrated tools: app.launch, doc.text, ext.*). No baseline exists yet.
            grep 'AIWS_GUEST_MODEL_BENCHMARK_V3 ' "$serial" | tail -n 1 | sed 's/^.*AIWS_GUEST_MODEL_BENCHMARK_V3 //' > out/aiws-guest-model-benchmark-v3.json
            python3 -m json.tool out/aiws-guest-model-benchmark-v3.json >/dev/null
          fi
          if [[ "$passed" != 1 ]]; then
            echo "Real QEMU guest 2B inference acceptance did not pass"
            exit 1
          fi
      - name: Upload actual guest-inference serial evidence (no weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiws-real-2b-qemu-guest-evidence
          path: out/aiws-guest-model-serial.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload metrics only (never redistribute model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiws-real-2b-cpu-inference-metrics
          path: out/aiws-real-model-metrics.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload held-out guest benchmark receipt (no prompts or model output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiws-2b-heldout-guest-benchmark
          path: |
            out/aiws-guest-model-benchmark.json
            out/aiws-guest-model-benchmark-v2.json
          if-no-files-found: warn
          retention-days: 30
