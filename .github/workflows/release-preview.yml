name: Release preview ISO (full image; model weights are NOT included)

# Publishes a GitHub PRE-RELEASE, and only after the image built, passed its checksums and booted to the
# AIWS boot smoke marker in QEMU. Anything less fails the run and publishes nothing.
on:
  push:
    paths:
      - 'release/PREVIEW.env'
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_COMMIT: 29b52d398b294509746ec0a3f28948a3107c0213

jobs:
  plan:
    name: Read the requested stage
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.read.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -a; . release/PREVIEW.env; set +a
          case "${AIWS_RELEASE_STAGE:-code}" in code|iso-dry|full) ;; *) echo "bad stage" >&2; exit 1;; esac
          echo "stage=${AIWS_RELEASE_STAGE:-code}" >> "$GITHUB_OUTPUT"
          echo "Stage: ${AIWS_RELEASE_STAGE:-code}  (code = AIWS Code + llama-server only; iso-dry = also build and boot the ISO; full = also publish)"

  aiws-code:
    name: Build AIWS Code (rebranded Code - OSS)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned upstream versions
        run: |
          set -a; . os/ide/PIN.env; set +a
          echo "NODE_VERSION=$AIWS_CODE_NODE_VERSION" >> "$GITHUB_ENV"
          echo "PNPM_VERSION=$AIWS_CODE_PNPM_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev zstd python3-pil
      - name: Install the pinned pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"
      - name: Build (product overrides, patches, artwork, endpoint scan)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ github.token }}        # upstream postinstall scripts download release assets from GitHub
          NODE_OPTIONS: --max-old-space-size=8192
          AIWS_CODE_WORK: ${{ runner.temp }}/aiws-code-build
        run: bash os/ide/build-aiws-code.sh
      - name: Keep only the package, its checksum and the audit report
        run: |
          mkdir -p ide-out
          cp "$RUNNER_TEMP"/aiws-code-build/aiws-code-*.tar.zst* ide-out/
          cp "$RUNNER_TEMP"/aiws-code-build/vscode-reh-web-linux-x64/endpoint-report.json ide-out/
          ls -la ide-out
      - uses: actions/upload-artifact@v4
        with:
          name: aiws-code
          path: ide-out
          retention-days: 7

  llama-server:
    name: Build llama-server for the Debian 13 guest ABI
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compile the pinned llama.cpp in a Debian 13 container
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/aiws-llama
          git -C /tmp/aiws-llama fetch origin "$LLAMA_CPP_COMMIT"
          git -C /tmp/aiws-llama checkout --detach "$LLAMA_CPP_COMMIT"
          docker build --progress=plain -t aiws-llama-debian-builder -f os/model/ci/Dockerfile.builder /tmp/aiws-llama
          container="$(docker create aiws-llama-debian-builder)"
          mkdir -p llama-out
          docker cp "$container:/src/build/bin/llama-server" llama-out/llama-server
          docker rm -f "$container" >/dev/null
          chmod 755 llama-out/llama-server
          file llama-out/llama-server
          (cd llama-out && sha256sum llama-server > llama-server.sha256)
          python3 os/model/ci/check_llama_cli.py llama-out/llama-server
      - uses: actions/upload-artifact@v4
        with:
          name: llama-server
          path: llama-out
          retention-days: 7

  iso:
    name: Build, boot-test and publish the ISO
    needs: [plan, aiws-code, llama-server]
    if: needs.plan.outputs.stage != 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Free disk space (the image build needs ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the release identity
        run: |
          set -a; . release/PREVIEW.env; set +a
          echo "TAG=$AIWS_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "TITLE=$AIWS_RELEASE_TITLE" >> "$GITHUB_ENV"
          echo "VERSION=${AIWS_RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build the React workbench
        working-directory: workbench
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm test
          npm run build
          test -s dist/index.html
      - uses: actions/download-artifact@v4
        with: {name: aiws-code, path: inputs/code}
      - uses: actions/download-artifact@v4
        with: {name: llama-server, path: inputs/llama}
      - name: Verify the pinned inputs (AIWS Code and llama-server; no model weights are downloaded or shipped)
        run: |
          set -Eeuo pipefail
          (cd inputs/code && sha256sum -c aiws-code-*.tar.zst.sha256)
          (cd inputs/llama && sha256sum -c llama-server.sha256)
      - name: Build the full ISO (language toolchains, AIWS Code, llama-server; no model weights) in a Debian 13 container
        timeout-minutes: 120
        run: |
          set -Eeuo pipefail
          chmod 755 inputs/llama/llama-server
          code_tar="$(ls inputs/code/aiws-code-*.tar.zst)"
          docker run --rm --privileged -v "$PWD":/repo -w /repo \
            -e AIWS_OS_PROFILE=full \
            -e AIWS_OS_OUTPUT=/repo/out/aiws-os \
            -e AIWS_OS_LLAMA_SERVER_SHA256="$(sha256sum inputs/llama/llama-server | cut -d' ' -f1)" \
            -e AIWS_OS_BUNDLED_LLAMA_SERVER=/repo/inputs/llama/llama-server \
            -e AIWS_CODE_TARBALL="/repo/$code_tar" \
            -e AIWS_CODE_SHA256="$(sha256sum "$code_tar" | cut -d' ' -f1)" \
            debian:trixie bash -lc '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools zstd python3
              ./os/debian/build.sh
            '
          # The container built as root: hand the output back to the runner user before later steps write next to it.
          sudo chown -R "$(id -u):$(id -g)" out
          ls -la out/aiws-os/*.iso out/aiws-os/*.packages 2>/dev/null || ls -la out/aiws-os
          (cd out/aiws-os && sha256sum -c live-image-amd64.hybrid.iso.sha256)
      - name: Prove the ISO contains llama-server and AIWS Code, and does NOT contain model weights
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends squashfs-tools xorriso
          iso=out/aiws-os/live-image-amd64.hybrid.iso
          mkdir -p "$RUNNER_TEMP/content"
          xorriso -osirrox on -indev "$iso" -extract /live/filesystem.squashfs "$RUNNER_TEMP/content/fs.squashfs"
          fs="$RUNNER_TEMP/content/fs.squashfs"
          if unsquashfs -l "$fs" | grep -E "model-preload|\.gguf$"; then echo "model weights must not be inside the release ISO"; exit 1; fi
          llama="$(unsquashfs -cat "$fs" usr/local/bin/llama-server | sha256sum | cut -d' ' -f1)"
          test "$llama" = "$(cut -d' ' -f1 inputs/llama/llama-server.sha256)"
          for f in opt/aiws-code/LICENSE.txt opt/aiws-code/ThirdPartyNotices.txt opt/aiws-code/AIWS-NOTICE.md opt/aiws-code/PROVENANCE.json; do
            test -n "$(unsquashfs -cat "$fs" "$f" | head -c 1)" || { echo "missing in ISO: $f"; exit 1; }
          done
          unsquashfs -cat "$fs" opt/aiws-code/PROVENANCE.json
          echo "CONTENT_CHECK=pass" >> "$GITHUB_ENV"
      - name: Boot the ISO in QEMU and require the AIWS boot smoke marker
        timeout-minutes: 60
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
          iso="$PWD/out/aiws-os/live-image-amd64.hybrid.iso"
          serial="$RUNNER_TEMP/boot-serial.log"
          accel=tcg; [[ -w /dev/kvm ]] && accel=kvm
          echo "QEMU acceleration: $accel"
          mkdir -p "$RUNNER_TEMP/live"
          xorriso -osirrox on -indev "$iso" -extract /live "$RUNNER_TEMP/live"
          kernel="$(find "$RUNNER_TEMP/live" -maxdepth 1 -type f -name 'vmlinuz*' | head -n1)"
          initrd="$(find "$RUNNER_TEMP/live" -maxdepth 1 -type f -name 'initrd*' | head -n1)"
          test -s "$kernel" && test -s "$initrd"
          qemu-system-x86_64 -machine q35,accel=$accel -cpu max -smp 2 -m 6144 \
            -cdrom "$iso" -kernel "$kernel" -initrd "$initrd" \
            -append 'boot=live components console=tty0 console=ttyS0,115200n8 loglevel=6' \
            -nic none -display none -vga std -serial "file:$serial" -no-reboot &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          passed=0
          for _ in $(seq 1 1500); do
            if [[ -s "$serial" ]] && grep -q 'AIWS_BOOT_SMOKE_PASS' "$serial"; then passed=1; break; fi
            if [[ -s "$serial" ]] && grep -q 'AIWS_BOOT_SMOKE_FAIL' "$serial"; then break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          tail -n 60 "$serial" || true
          echo "BOOT_SMOKE=$([[ $passed == 1 ]] && echo pass || echo fail)" >> "$GITHUB_ENV"
          [[ $passed == 1 ]] || { echo "The ISO did not reach AIWS_BOOT_SMOKE_PASS: nothing will be published"; exit 1; }
      - name: Assemble release files (split below GitHub's 2 GiB asset limit) and notes
        run: |
          set -Eeuo pipefail
          mkdir -p release-files
          iso=out/aiws-os/live-image-amd64.hybrid.iso
          name="aiws-os-${VERSION}-amd64.iso"
          iso_sha="$(sha256sum "$iso" | cut -d' ' -f1)"
          size=$(stat -c %s "$iso")
          if (( size > 1950*1024*1024 )); then
            split --bytes=1900M --numeric-suffixes=1 --suffix-length=2 "$iso" "release-files/${name}."
          else
            cp "$iso" "release-files/$name"
          fi
          cp out/aiws-os/*.packages release-files/aiws-os-${VERSION}-packages.txt 2>/dev/null || true
          cp inputs/code/endpoint-report.json release-files/aiws-code-endpoint-report.json
          cp NOTICE docs/THIRD_PARTY.md release-files/
          (cd release-files && sha256sum -- * > SHA256SUMS && echo "$iso_sha  ${name} (reassembled)" >> SHA256SUMS)
          cat > release-files/REASSEMBLE.txt <<TXT
          If the ISO is split into ${name}.01, .02 ...:
            cat ${name}.0* > ${name}
            sha256sum ${name}      # must equal ${iso_sha}
          TXT
          {
            echo "# ${TITLE}"
            echo
            echo "**测试版 / PRE-RELEASE — 仅供在虚拟机里验证，不要写入重要磁盘。** 这是 0.2.0-preview.1 之后的第二个测试镜像（本地模型由 2B 换成 9B，新增本地助手），未经过任何物理机、Secure Boot 或长期使用验证；**镜像体积约 9–10 GB，已拆成多个分卷，见下方“校验与重组”**。"
            echo
            echo "面向程序员的 AI 原生操作系统：工作台就是桌面；本地 9B 模型做路由、读日志和提案（它从不自己改任何东西，改动都要你在计划审核区批准）；云端模型直接接 DeepSeek API（带受限的编译/测试/运行工具），也可经官方 CLI；预装常用语言环境与开源工具，AIWS Code（Code - OSS 重新品牌化）按需打开。"
            echo
            echo "## 这个镜像里有什么"
            echo "- Debian 13 (trixie) Live，无边框 Openbox + 全屏工作台（没有桌面环境），自动登录用户 \`user\`（Live 默认密码 \`live\`）"
            echo "- VS Code 风格工作台（\`workbench\`，中英双语）：总览、计划审核、云端智能体树、变更审查、构建、**本地助手**（技能、插件、路由）、系统设置；Agent、Permission Broker、审批 DAG、模型网关"
            echo "- 本地助手：每步一个受约束的 JSON 动作；只读工具自动执行，改动只能提案；技能（Agent Skills 格式）与插件（只取文字，从不运行钩子/脚本）；读日志工具；三档路由（local / flash / pro）。详见 docs/AIWS_LOCAL_AGENT.md"
            echo "- 开发工具链：Python、Node.js/TypeScript、Go、Rust、Java、Ruby、PHP、Lua、C/C++ 等及常用 CLI 工具"
            echo "- AIWS Code：Code - OSS ${AIWS_CODE_TAG:-1.147.0} 重新品牌化构建（MIT；保留上游许可与声明）"
            echo "- llama.cpp 的 llama-server（固定提交 \`${LLAMA_CPP_COMMIT}\`）已随镜像提供；**镜像里没有任何模型权重**。"
            echo
            echo "## 模型权重：自己下载，镜像不带"
            echo "产品模型是 Qwen3.5-9B（Q4_K_M，约 5.7 GB，Apache-2.0）。权重不随镜像发布，请自行下载并校验哈希后放入系统，**完整步骤见仓库文档 docs/AIWS_MODEL_WEIGHTS.md**。没有权重时系统其余部分（工作台、计划审核、云端构建、文件与日志的确定性工具）都能用，只是没有本地助手和本地路由。"
            echo "- 客户机里用 CPU 跑 9B 实测需要约 11 GiB 内存（默认虚拟机 6 GiB 不够，而且很慢），请把虚拟机内存调到 ≥ 14 GiB。"
            echo "- 宿主显卡通道的代码已在仓库里，但**这个镜像和启动脚本里还没有接线**，所以现在不是可用的路径。"
            echo
            echo "## 验证状态（如实）"
            echo "- ✅ 构建期：校验和、AIWS Code 许可文件齐全检查、工作台测试通过"
            echo "- ✅ 从成品 ISO 里读回：确认**没有**模型权重；llama-server 与构建产物一致；AIWS Code 的 LICENSE / ThirdPartyNotices / 来源记录都在镜像里"
            echo "- ✅ 本地助手：用真实 Qwen3.5-9B 与真实 llama-server（在开发环境里自己编的，不是镜像里固定的那个提交）做过端到端验证（9 个场景全通过）；Python 913 项、前端 45 项测试通过"
            echo "- ✅ QEMU 启动到 \`AIWS_BOOT_SMOKE_PASS\`（加速方式见 Actions 日志）"
            echo "- ❓ **未验证**：按文档把 9B 放进本镜像并在客户机里实际运行、真实模型门与真实 9B 一起运行、显卡通道、新外壳（无桌面环境）的输入法与分辨率、双盘/只读系统盘在真机上的行为、真实硬件/Secure Boot、模型在本镜像里的真实质量、官方 CLI（Claude Code / Codex）真实端到端、AIWS Code 在镜像内的完整可用性、桌面程序启动"
            echo "- 安全边界是应用层（同 UID 的 Broker），**不是内核强制隔离**"
            echo
            echo "## 校验与重组"
            echo "ISO sha256：\`${iso_sha}\`。文件被拆成 ≤1.9 GiB 的分卷（GitHub 单个附件上限 2 GiB）时，见 \`REASSEMBLE.txt\`，并用 \`SHA256SUMS\` 校验。"
            echo
            echo "## 许可与源码"
            echo "仓库代码 Apache-2.0。镜像包含 Debian 软件包、Linux 内核、Code - OSS、llama.cpp等第三方组件（模型权重不随镜像发布，其许可见 docs/AIWS_MODEL_WEIGHTS.md），各自保留其许可；见 \`NOTICE\`、\`THIRD_PARTY.md\`、\`QWEN-LICENSE.txt\` 与随 AIWS Code 附带的 \`LICENSE.txt\`/\`ThirdPartyNotices.txt\`。Debian 包清单（含版本）见 \`aiws-os-${VERSION}-packages.txt\`，其源码可从 Debian 归档获取（\`apt-get source <包名>\`，源码索引 https://deb.debian.org/debian/ 下 trixie 的 \`deb-src\`）。"
            echo
            echo "构建提交：\`${GITHUB_SHA}\` · Actions 运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-notes.md
          ls -la release-files; du -sh release-files
      - name: Publish the pre-release
        if: needs.plan.outputs.stage == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file release-notes.md --prerelease
      - name: Keep the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-log
          path: ${{ runner.temp }}/boot-serial.log
          if-no-files-found: ignore
          retention-days: 14
