# Dedicated, login-less accounts for the AI side. The person keeps using the normal login user.
# STAGED: files and permissions below are in place; moving the Agent and Broker services onto these users is a later step
# (they still run as the login user's systemd user services today).
g aiws-work -
u aiws-agent  - "AIWS agent (tool runner)"       /var/lib/aiws-agent  /usr/sbin/nologin
u aiws-broker - "AIWS permission broker"         /var/lib/aiws-broker /usr/sbin/nologin
m aiws-agent aiws-work
