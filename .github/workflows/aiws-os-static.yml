name: AIWS OS static contract
on:
  push:
    paths:
      - 'os/**'
      - 'workbench/**'
      - 'docs/AIWS_OS_BLUEPRINT.md'
      - 'docs/AIWS_OS_ALPHA_PLAN.md'
      - '.github/workflows/aiws-os-static.yml'
  pull_request:
    paths:
      - 'os/**'
      - 'docs/AIWS_OS_BLUEPRINT.md'
      - '.github/workflows/aiws-os-static.yml'
jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n os/debian/build.sh
          python3 -m py_compile os/installer/aiws_install_preflight.py
          bash -n os/kernel/ci/firmware-iso-boot.sh
          sh -n os/debian/config/includes.chroot/usr/local/bin/aiws-session
          sh -n os/debian/config/includes.chroot/usr/local/bin/aiws-boot-smoke
          sh -n os/debian/config/includes.chroot/usr/local/bin/aiws-broker
          python3 -m py_compile os/runtime/aiws_permission_broker.py os/runtime/aiws_mcp.py
          bash -n os/host/run-qemu-offline.sh
          bash -n os/debian/config/includes.chroot/usr/local/bin/aiws-system-status
          bash -n os/debian/config/includes.chroot/usr/local/bin/aiws-admin-session
      - name: Lint (undefined names, unused code, shell warnings)
        run: |
          python3 -m pip install --quiet ruff
          ruff check --no-cache --select F,E9,PLE $(git ls-files '*.py')
          shellcheck -S warning $(git ls-files '*.sh') os/debian/config/includes.chroot/usr/local/bin/* os/debian/config/hooks/normal/*.hook.binary
      - name: Install test-only Python packages
        run: python3 -m pip install --quiet pillow
      - name: Frontend tests (pure logic)
        working-directory: workbench
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm test
      - name: Static OS security contracts
        run: python3 -m unittest discover -s os/verify -p 'test_*.py' -v

  ui-audit:
    # Every view in dark/light/small, every button clicked, and the in-image smoke steps replayed, against the REAL guest
    # service (os/verify/fixtures/serve_workbench.py). Catches what unit tests cannot: a font the server refuses, a
    # control with no effect, a layout that spills out of the window. Screenshots are kept as an artifact.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the workbench
        working-directory: workbench
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Playwright and Chromium (pinned, test-only)
        working-directory: workbench
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser audit of every view against the real guest service
        working-directory: workbench
        run: node e2e/ui-audit.cjs e2e-out
      - name: Keep the screenshots and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: workbench/e2e-out
          if-no-files-found: ignore
          retention-days: 14
