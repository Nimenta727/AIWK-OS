name: Python & Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m compileall -q aiws tests app.py
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Parse PowerShell scripts (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count) {
              $parseErrors | ForEach-Object { Write-Error "$_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  portable-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build portable ZIP
        run: python scripts/package_portable.py --output AIWS-Prototype.zip
      - name: Inspect portable ZIP
        run: python -m zipfile -t AIWS-Prototype.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AIWS-Windows-Portable
          path: AIWS-Prototype.zip
          retention-days: 30
